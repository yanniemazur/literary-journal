<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Cardboard Box</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background-color: #f5f1e8;
            color: #1c1c1c;
        }

        header {
            padding: 40px;
            text-align: center;
            border-bottom: 1px solid #1c1c1c;
        }

        h1 {
            font-size: 48px;
            margin: 0;
        }

        nav {
            margin-top: 20px;
        }

        nav a {
            margin: 0 15px;
            color: #1c1c1c;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 900px;
            margin: 80px auto;
            padding: 0 30px;
        }

        .intro {
            text-align: center;
        }

        .intro h2 {
            font-size: 36px;
        }

        .intro p {
            font-size: 18px;
            line-height: 1.7;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            border: 1px solid #1c1c1c;
            color: #1c1c1c;
            text-decoration: none;
        }

        .button:hover {
            background-color: #1c1c1c;
            color: #f5f1e8;
        }

        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid #1c1c1c;
        }
    </style>
</head>

<body>

    <header>
        <h1>MY LITERARY JOURNAL</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Read</a>
            <a href="#">Submit</a>
            <a href="#">About</a>
        </nav>
    </header>

    <main>

        <section class="intro">

            <h2>Welcome.</h2>

            <p>
                A literary journal dedicated to emerging writers,
                strange ideas, beautiful sentences, and stories worth telling.
            </p>

            <a href="#" class="button">READ THE LATEST ISSUE</a>

        </section>

    </main>

    <footer>
        <p>© 2026 My Literary Journal</p>
    </footer>

</body>
</html>
